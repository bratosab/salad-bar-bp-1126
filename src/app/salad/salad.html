<p>Welcome {{ name() }}, choose you toppings below :</p>

<div class="toppings-lists">
  <app-toppings
    [toppings]="toppings()"
    (clickTopping)="chooseTopping($event)"
    listTitle="Available toppings :"
    buttonLabel="+1"
  ></app-toppings>

  <app-toppings
    [toppings]="chosenToppings()"
    (clickTopping)="removeTopping($event)"
    listTitle="Your toppings :"
    buttonLabel="-1"
  ></app-toppings>

  <div>
    Total price : {{ orderService.totalPrice() | currency:'€' }}
  </div>
</div>
